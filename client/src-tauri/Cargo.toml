[package]
name = "c2c_client"
version = "0.1.0"
description = "The client of a light and efficient remote desktop tool"
authors = ["AshLink", "Big Laude"]
edition = "2021"

[lib]
name = "c2c_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
